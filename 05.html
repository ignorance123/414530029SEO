<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO Practice05</title>
    <style>
        p {
            color: green;
            font-size: 36px;
        }

        .hclass {
            color: pink
        }

        #hid {
            color: gray
        }
    </style>
    <link rel="stylesheet" href="css/selector.css">
</head>

<body>
    <div style="color:blue;text-decoration:underline;font-size:25px">inline</div><!-- inline -->
    <p>type</p><!-- embedding --><!-- type selector -->
    <h2 class="hclass">class</h2><!-- class selector -->
    <h2 id="hid">id</h2><!-- id selector -->
    <h2 class="hlink">linking</h2><!-- linking -->
    <hr>
    <div style="text-decoration:none">none</div>
    <div style="text-decoration:overline">overline</div>
    <div style="text-decoration:underline">underline</div>
    <div style="text-decoration:line-through">line-through</div>
    <hr>
    <div style="text-transform:none">none</div>
    <div style="text-transform:capitalize">capitalize</div>
    <div style="text-transform:uppercase">upPerCase</div>
    <div style="text-transform:lowercase">LOwERCaSE</div>
    <hr>
    <div style="color:blue">blue</div>
    <div style="color:#1abc3d">green</div>
    <div style="color:rgb(100,100,100)">rgb</div>
    <div style="color:rgba(100,100,100,0.5)">rgba</div>
</body>

</html>
